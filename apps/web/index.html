<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline theme init: apply dark class before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/jpeg" href="/gremlin-logo.jpg" />
    <link rel="apple-touch-icon" href="/gremlin-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gremlin — Brutally honest focus companion.</title>
    <meta name="description" content="A pixel companion that lives in your browser, reads your browsing narrative instead of a blacklist, and roasts you back on task during deep work sprints." />
    <meta name="theme-color" content="#0B0D10" />
    <meta property="og:title" content="Gremlin — The AI Browser Desk Companion" />
    <meta property="og:description" content="Stop doomscrolling. Get roasted back on task. An AI focus companion that judges your browsing narrative, not your domains." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-accent selection:text-coal">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
